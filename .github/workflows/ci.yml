name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floraos
          POSTGRES_PASSWORD: floraos
          POSTGRES_DB: floraos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://floraos:floraos@localhost:5432/floraos
      # `test:tenant`/`test:platform` mặc định trỏ `smeos@5433/smeos_test` (máy dev, e8a75d2) —
      # CI dựng Postgres `floraos@5432`, nên phải chỉ rõ DB test ở đây, không thì cổng bắt buộc
      # không kết nối được (rà soát 21/10/2026, C4).
      DATABASE_URL_TEST: postgresql://floraos:floraos@localhost:5432/floraos_test
      SESSION_SECRET: ci-only-not-a-real-secret
      # P7 (YC-T8) — `src/lib/env.ts` BẮT BUỘC biến này. Thiếu nó thì bước
      # `npm run db:seed` ném ngay ở dòng import, trước cả `typecheck`, và
      # cổng bắt buộc `test:tenant` không bao giờ chạy tới. Khoá riêng, không
      # dùng lại SESSION_SECRET — giữ đúng lý do tách khoá của P7.
      INTEGRATION_TOKEN_SECRET: ci-only-not-a-real-integration-secret
      # SSO (floraos-core ↔ SocialFlow/LocalBudd) — `src/lib/env.ts` bắt buộc
      # (commit 23c2299). Thiếu thì `db:seed` ném ở dòng import như trường hợp P7.
      SSO_SESSION_SECRET: ci-only-not-a-real-sso-secret
      # Khoá GIẢ. `tests/tenant/product-copies.test.ts` mock HTTP
      # chat/completions và `tests/setup.ts` chặn mạng, nên không lời gọi nào ra
      # ngoài — nhưng `OpenAILLMProvider` đòi khoá có mặt lúc khởi tạo.
      OPENAI_API_KEY: ci-only-fake-key-network-is-blocked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      # Dựng CSDL bằng đúng lệnh production dùng (`migrate deploy`), rồi đòi
      # migration khớp schema.prisma: sửa schema mà quên `prisma migrate dev` là đỏ.
      - run: npm run db:deploy
      - name: Migration khớp schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # Database RIÊNG cho `test:tenant`/`test:platform` — hai bộ test này
      # TRUNCATE mọi bảng và `tests/helpers/database.ts` từ chối database không
      # kết thúc bằng `_test`. Thiếu bước này thì cổng bắt buộc đỏ với
      # `database "floraos_test" does not exist` (CI run 4, 25/09/2026).
      - name: Dựng database floraos_test
        env:
          PGPASSWORD: floraos
        run: |
          psql -h localhost -U floraos -d postgres -c 'CREATE DATABASE floraos_test'
          DATABASE_URL=postgresql://floraos:floraos@localhost:5432/floraos_test npx prisma db push
      - run: npm run db:seed
      - run: npm run typecheck
      # Ratchet thay cho `npm run lint` (nợ #172, 05/10/2026): main mang 78 lỗi
      # ESLint cũ, bước lint đỏ trước nên CI bỏ qua MỌI bước sau — kể cả cổng
      # bắt buộc test:tenant. Ratchet đỏ khi (tệp, luật) nào tăng lỗi so với
      # scripts/eslint-baseline.json; lỗi cũ dọn dần rồi chạy --update-baseline.
      - name: ESLint (ratchet — không thêm lỗi mới)
        run: npm run lint:ratchet
      - name: Đối chiếu tài liệu với mã (đặc tả 06/07, cách ly tenant, tài liệu agent)
        run: npm run check:docs
      - run: npm run lint:ux -- --check
      - run: npm test
      - name: Đối chiếu SSOT template với code thật
        run: npm run check:template-ssot
      # Cổng bắt buộc. Không được phép bỏ qua hay đánh dấu continue-on-error.
      - name: Test cách ly tenant
        run: npm run test:tenant
      # Cổng bắt buộc (P25a) — bốn ca thử cách ly console vận hành nền tảng,
      # xem tests/platform/cach-ly-platform.test.ts.
      - name: Test cách ly Console Vận hành Nền tảng
        run: npm run test:platform
      - run: npm run build

  # Chuỗi cung ứng (rà soát 21/10/2026, giai đoạn 3; PO duyệt 22/10). Repo công khai, nên một
  # khoá lọt vào bất kỳ commit nào là lộ ngay — quét toàn lịch sử, không chỉ commit mới.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Quét bí mật bằng gitleaks (báo nhầm đã duyệt nằm ở .gitleaksignore)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # Chỉ chặn lỗ hổng CRITICAL ở dependency chạy trên production. 12 lỗi `high` có sẵn
      # (gồm `xlsx`, chưa có bản vá) là nợ đã ghi nhận, không chặn ở đây.
      - name: npm audit (production, mức critical)
        run: npm audit --omit=dev --audit-level=critical

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Worker âm thanh/video gọi ffmpeg thật (phối trộn, đo độ to) — runner
      # ubuntu-latest không cài sẵn, thiếu thì 12 ca test_audio_worker /
      # test_voice_clone_worker đỏ `FileNotFoundError: 'ffmpeg'`.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  e2e-ux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: floraos
          POSTGRES_PASSWORD: floraos
          POSTGRES_DB: floraos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://floraos:floraos@localhost:5432/floraos
      SESSION_SECRET: ci-only-not-a-real-secret
      INTEGRATION_TOKEN_SECRET: ci-only-not-a-real-integration-secret
      SSO_SESSION_SECRET: ci-only-not-a-real-sso-secret
      OPENAI_API_KEY: ci-only-fake-key-network-is-blocked
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Chạy kiểm thử E2E UX theo vai và mốc trợ năng
        run: E2E_WEB_COMMAND="npm run start" npx playwright test tests/e2e/ux
      # Giữ ảnh chụp/trace khi E2E đỏ. Ảnh `*-actual.png` của visual.spec.ts
      # chụp đúng trên runner này là nguồn ảnh mẫu `*-linux.png` (nợ #172) —
      # không chụp ảnh mẫu trên máy khác vì font tải từ Google lúc chạy.
      - name: Lưu kết quả E2E khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ux-test-results
          path: test-results/
          retention-days: 7

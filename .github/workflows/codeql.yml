# Phân tích tĩnh (SAST) bằng CodeQL — miễn phí cho repo công khai.
# Rà soát 21/10/2026, giai đoạn 3; PO duyệt 22/10. Kết quả nằm ở tab Security → Code scanning.
name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - src/generated
              - node_modules
              - .next
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

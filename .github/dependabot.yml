# Cập nhật dependency tự động (rà soát 21/10/2026, giai đoạn 3; PO duyệt 22/10).
# Mỗi PR của Dependabot vẫn phải qua đủ cổng CI và được người duyệt — không tự merge.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/workers"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

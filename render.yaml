# render.yaml — smeOS Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ══════════════════════════════════════════════
  # 1. WEB SERVICE — Next.js App
  # ══════════════════════════════════════════════
  - type: web
    name: smeos-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SEED_DEV_DATA
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: SESSION_SECRET
        generateValue: true
      - key: SSO_SESSION_SECRET
        generateValue: true
      - key: INTEGRATION_TOKEN_SECRET
        generateValue: true
      # Redis (tuỳ chọn) — nếu không có thì rate limiting bị tắt
      # - key: REDIS_URL
      #   fromService:
      #     type: keyvalue
      #     name: smeos-redis
      #     property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_VERTEX_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: SERPAPI_API_KEY
        sync: false
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_TIMEOUT_SECONDS
        value: "120"
      - key: IOPAINT_DEVICE
        value: cpu
      - key: GREETING_CARD_ENABLED
        value: "true"

  # ══════════════════════════════════════════════
  # 2. BACKGROUND WORKER — Media AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-media
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_DEVICE
        value: cpu

  # ══════════════════════════════════════════════
  # 3. BACKGROUND WORKER — Video AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-video
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.video.video_worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # 4. BACKGROUND WORKER — Vision AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-vision
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m vision.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # KEY VALUE (Redis) — bị comment vì Render chỉ cho 1 free instance
  # Bật lại khi nâng cấp plan hoặc xoá Redis từ project khác
  # ══════════════════════════════════════════════
  # - type: keyvalue
  #   name: smeos-redis
  #   region: singapore
  #   plan: free
  #   maxmemoryPolicy: allkeys-lru
  #   ipAllowList: []

# ══════════════════════════════════════════════
# DATABASE — PostgreSQL 16
# ══════════════════════════════════════════════
databases:
  - name: smeos-postgres
    databaseName: smeos
    user: smeos
    region: singapore
    plan: basic-256mb

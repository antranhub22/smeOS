# render.yaml — smeOS Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code
#
# Blueprint TỰ ĐỦ: New → Blueprint, trỏ vào repo này là xong (PO 05/11/2026).
#   • Mọi dịch vụ đặt `autoDeployTrigger: checksPass` + `branch: main` → Render tự deploy
#     khi `main` đổi, NHƯNG chỉ sau khi check CI của commit đó xanh. KHÔNG cần deploy hook,
#     KHÔNG cần secret `RENDER_DEPLOY_HOOK_*`, KHÔNG có job `deploy` trong CI.
#     Cổng "chỉ deploy bản đã qua kiểm" (P0-02, D-14) vì vậy được GIỮ NGUYÊN, chỉ đổi nơi
#     thực thi: từ job `deploy` sang chính Render. Commit KHÔNG có check nào, hoặc có check
#     đỏ, đều KHÔNG deploy — hỏng theo hướng an toàn (không deploy), không phải deploy bừa.
#     Ruleset `main` của GitHub vẫn nên bật, nhưng giờ là lớp phòng vệ thứ hai, không còn
#     là cổng duy nhất.
#   • Bốn biến BẮT BUỘC của mã nguồn (`src/lib/env.ts`) đều tự có:
#     DATABASE_URL (`fromDatabase`), SESSION_SECRET / SSO_SESSION_SECRET /
#     INTEGRATION_TOKEN_SECRET (`generateValue`). CRON_SECRET cũng `generateValue`,
#     cron lấy lại đúng giá trị đó qua `fromService.envVarKey` — không còn phải tự tay
#     đặt cùng một giá trị ở hai dịch vụ.
#   • Các khoá `sync: false` còn lại đều KHÔNG bắt buộc để app chạy: thiếu thì tính năng
#     tương ứng (AI, kho tệp, Zalo, Messenger…) tắt. Điền sau trong Render khi cần,
#     không chặn lần sync blueprint đầu tiên.

services:
  # ══════════════════════════════════════════════
  # 1. WEB SERVICE — Next.js App
  # ══════════════════════════════════════════════
  - type: web
    name: smeos-web
    runtime: node
    region: singapore
    plan: starter
    # Build KHÔNG chạm CSDL (ADR-015 D-O4, bước O-4 — PO duyệt 05/11/2026). Migration + seed hệ thống chạy ở
    # pre-deploy: sau build thành công, trước khi bản mới nhận traffic; lỗi thì bản cũ vẫn chạy.
    # `db:seed` trên production chỉ nạp dữ liệu hệ thống (SEED_DEV_DATA=false — prisma/seed/dev-seed-policy.ts).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    preDeployCommand: npm run db:deploy && npm run db:seed
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass # tự deploy `main` NHƯNG chỉ khi CI xanh (PO 05/11/2026)
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      # RLS theo tổ chức (ADR-013, checklist ALG 1.18): ghi nhận trước; chuyển 'enforce' khi log sạch
      - key: DB_RLS_MODE
        value: audit
      - key: NODE_ENV
        value: production
      # Ghim runtime theo CI (`.github/workflows/ci.yml` dùng Node 22.x). Không ghim thì
      # Render chọn bản mặc định của nó và build có thể khác CI.
      - key: NODE_VERSION
        value: "22"
      # `npm run start` là `next start -p 3200`. Khai cùng cổng để health check của Render
      # gọi đúng chỗ, không phụ thuộc vào việc Render tự dò cổng đang mở.
      - key: PORT
        value: "3200"
      # Khoá tính năng chưa mở cho khách (`src/lib/feature-lock.ts`). Biến NEXT_PUBLIC_ gắn
      # lúc build nên phải khai ở đây; thiếu thì production mở hết tuyến còn đang khoá.
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: SEED_DEV_DATA
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      # Bỏ kiểm kiểu trong `next build` trên Render: commit được deploy đã qua `npm run typecheck` ở CI
      # (job `deploy` chỉ chạy khi CI xanh — P0-02/P0-08). Build trên CI vẫn kiểm kiểu.
      - key: SKIP_BUILD_TYPECHECK
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SSO_SESSION_SECRET
        generateValue: true
      - key: INTEGRATION_TOKEN_SECRET
        generateValue: true
      # ADR-014 P-5a (PO 07/11/2026): khoá chủ mã hoá cột dữ liệu cá nhân của khách — 32 byte base64
      # (`openssl rand -base64 32`). Người vận hành tự tạo, tự đặt và SAO LƯU ở kho bí mật: mất khoá = mất dữ liệu.
      # Không dùng generateValue: dựng lại blueprint sẽ sinh khoá khác. Runbook: docs/handover/OPERATIONS_RUNBOOK.md §14.
      - key: PII_ENCRYPTION_KEY
        sync: false
      # Khoá ký URL kho tệp, tách khỏi SESSION_SECRET (SDAGF D-07).
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      # Redis dùng chung cho giới hạn tần suất (đăng nhập, link công khai) giữa các instance.
      # Thiếu thì rate-limit chỉ đếm trong bộ nhớ từng tiến trình (rà soát 21/10/2026, H7).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smeos-redis
          property: connectionString
      # Secret của endpoint cron nội bộ. Render tự sinh ở đây; smeos-cron-dispatch-sweep
      # lấy lại đúng giá trị này qua `fromService.envVarKey` nên không phải nhập tay.
      # Thiếu thì /api/v1/internal/* luôn từ chối trên production (rà soát 21/10/2026, H3).
      - key: CRON_SECRET
        generateValue: true
      # KHÔNG khai `NEXT_PUBLIC_APP_URL` ở đây: render.yaml không nội suy được chuỗi nên không
      # dựng được "https://" + host của dịch vụ, mà khai `sync: false` thì lại thành một ô phải
      # điền tay. Link công khai rơi về `RENDER_EXTERNAL_URL` do Render tự cấp
      # (`src/lib/public-url.ts`), đúng cho tên miền *.onrender.com. Khi gắn tên miền riêng
      # (vd. app.smeos.vn): thêm `NEXT_PUBLIC_APP_URL` trên Render → smeos-web → Environment.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_VERTEX_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: SERPAPI_API_KEY
        sync: false
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_TIMEOUT_SECONDS
        value: "120"
      - key: IOPAINT_DEVICE
        value: cpu
      - key: GREETING_CARD_ENABLED
        value: "true"
      - key: TELEGRAM_DISPATCH_BOT_TOKEN
        sync: false
      # Toạ độ địa chỉ giao cho điều phối chuỗi (thiếu: xếp hạng theo phường/quận)
      - key: GOONG_API_KEY
        sync: false
      # Zalo OA — gửi lời mời/nhắc việc cho chi nhánh qua Zalo
      - key: ZALO_OA_APP_ID
        sync: false
      - key: ZALO_OA_APP_SECRET
        sync: false
      - key: ZALO_OA_REFRESH_TOKEN
        sync: false
      - key: ZALO_OA_WEBHOOK_SECRET
        sync: false
      - key: ZALO_OA_FOLLOW_URL
        sync: false
      # Chat bán hàng qua Facebook Messenger — chữ ký webhook (audit AUD-028); thiếu thì webhook từ chối mọi sự kiện
      - key: FB_APP_SECRET
        sync: false
      - key: FB_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_STAFF_BOT_TOKEN
        sync: false

  # ══════════════════════════════════════════════
  # 2. BACKGROUND WORKER — Media AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-media
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.jobs.worker
    autoDeployTrigger: checksPass # tự deploy `main` NHƯNG chỉ khi CI xanh (PO 05/11/2026)
    branch: main
    envVars:
      # Ghim runtime theo CI (job `worker` dùng Python 3.11).
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      # RLS theo tổ chức (ADR-013, checklist ALG 1.18): ghi nhận trước; chuyển 'enforce' khi log sạch
      - key: DB_RLS_MODE
        value: audit
      - key: OPENAI_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_DEVICE
        value: cpu

  # ══════════════════════════════════════════════
  # 3. BACKGROUND WORKER — Video AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-video
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.video.video_worker
    autoDeployTrigger: checksPass # tự deploy `main` NHƯNG chỉ khi CI xanh (PO 05/11/2026)
    branch: main
    envVars:
      # Ghim runtime theo CI (job `worker` dùng Python 3.11).
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      # RLS theo tổ chức (ADR-013, checklist ALG 1.18): ghi nhận trước; chuyển 'enforce' khi log sạch
      - key: DB_RLS_MODE
        value: audit
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # 4. BACKGROUND WORKER — Vision AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-vision
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m vision.jobs.worker
    autoDeployTrigger: checksPass # tự deploy `main` NHƯNG chỉ khi CI xanh (PO 05/11/2026)
    branch: main
    envVars:
      # Ghim runtime theo CI (job `worker` dùng Python 3.11).
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      # RLS theo tổ chức (ADR-013, checklist ALG 1.18): ghi nhận trước; chuyển 'enforce' khi log sạch
      - key: DB_RLS_MODE
        value: audit
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # 5. CRON — nhắc mốc tiến độ đơn gia công chuỗi (M1–M4), 5 phút/lần
  # ══════════════════════════════════════════════
  # Gọi web qua mạng nội bộ Render. Không có job này thì nhắc việc M1–M4 không bao giờ chạy.
  # Sau cùng chạy lượt Trung tâm Tích hợp (xử lý sự kiện đến hạn + kiểm sức khoẻ kết nối, có giới hạn mỗi lượt — PO 31/10/2026).
  # Lượt quét cũng dọn job treo quá 15 phút (YC-J10). Sau lượt quét, kiểm /internal/health: không khoẻ → 503 → lượt cron thất bại → Render báo lỗi.
  - type: cron
    name: smeos-cron-dispatch-sweep
    runtime: node
    region: singapore
    schedule: "*/5 * * * *"
    autoDeployTrigger: checksPass # tự deploy `main` NHƯNG chỉ khi CI xanh (PO 05/11/2026)
    branch: main
    buildCommand: echo "no build"
    startCommand: >-
      curl -fsS -X POST "http://$WEB_HOSTPORT/api/v1/internal/chain-dispatch-sweep"
      -H "x-cron-secret: $CRON_SECRET" --max-time 120
      && curl -fsS "http://$WEB_HOSTPORT/api/v1/internal/health"
      -H "x-cron-secret: $CRON_SECRET" --max-time 20
      && curl -fsS -X POST "http://$WEB_HOSTPORT/api/v1/internal/integrations-sweep"
      -H "x-cron-secret: $CRON_SECRET" --max-time 60
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEB_HOSTPORT
        fromService:
          type: web
          name: smeos-web
          property: hostport
      # Lấy lại đúng CRON_SECRET mà Render đã sinh cho smeos-web — hai dịch vụ luôn khớp,
      # không còn ô phải điền tay ở hai nơi.
      - key: CRON_SECRET
        fromService:
          type: web
          name: smeos-web
          envVarKey: CRON_SECRET

  # ══════════════════════════════════════════════
  # KEY VALUE (Redis) — bộ đếm giới hạn tần suất dùng chung các instance
  # Gói trả phí 256mb: workspace chỉ có 1 instance free và đang dùng cho project khác.
  # ══════════════════════════════════════════════
  - type: keyvalue
    name: smeos-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # chỉ dịch vụ nội bộ Render truy cập

# ══════════════════════════════════════════════
# DATABASE — PostgreSQL 16
# ══════════════════════════════════════════════
databases:
  - name: smeos-postgres
    databaseName: smeos
    user: smeos
    region: singapore
    plan: basic-256mb

# render.yaml — smeOS Infrastructure as Code
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ══════════════════════════════════════════════
  # 1. WEB SERVICE — Next.js App
  # ══════════════════════════════════════════════
  - type: web
    name: smeos-web
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npm run db:deploy && npm run db:seed && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SEED_DEV_DATA
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: SESSION_SECRET
        generateValue: true
      - key: SSO_SESSION_SECRET
        generateValue: true
      - key: INTEGRATION_TOKEN_SECRET
        generateValue: true
      # Redis dùng chung cho giới hạn tần suất (đăng nhập, link công khai) giữa các instance.
      # Thiếu thì rate-limit chỉ đếm trong bộ nhớ từng tiến trình (rà soát 21/10/2026, H7).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smeos-redis
          property: connectionString
      # Secret của endpoint cron nội bộ — đặt CÙNG MỘT giá trị ở đây và ở smeos-cron-dispatch-sweep.
      # Thiếu thì /api/v1/internal/* luôn từ chối trên production (rà soát 21/10/2026, H3).
      - key: CRON_SECRET
        sync: false
      # URL công khai của app (vd. https://app.smeos.vn) — dùng dựng link gửi chi nhánh/khách,
      # kể cả khi request đến từ cron qua mạng nội bộ.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_VERTEX_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: SERPAPI_API_KEY
        sync: false
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_TIMEOUT_SECONDS
        value: "120"
      - key: IOPAINT_DEVICE
        value: cpu
      - key: GREETING_CARD_ENABLED
        value: "true"
      - key: TELEGRAM_DISPATCH_BOT_TOKEN
        sync: false
      # Toạ độ địa chỉ giao cho điều phối chuỗi (thiếu: xếp hạng theo phường/quận)
      - key: GOONG_API_KEY
        sync: false
      # Zalo OA — gửi lời mời/nhắc việc cho chi nhánh qua Zalo
      - key: ZALO_OA_APP_ID
        sync: false
      - key: ZALO_OA_APP_SECRET
        sync: false
      - key: ZALO_OA_REFRESH_TOKEN
        sync: false
      - key: ZALO_OA_WEBHOOK_SECRET
        sync: false
      - key: ZALO_OA_FOLLOW_URL
        sync: false
      # Chat bán hàng qua Facebook Messenger — chữ ký webhook (audit AUD-028); thiếu thì webhook từ chối mọi sự kiện
      - key: FB_APP_SECRET
        sync: false
      - key: FB_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: TELEGRAM_STAFF_BOT_TOKEN
        sync: false

  # ══════════════════════════════════════════════
  # 2. BACKGROUND WORKER — Media AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-media
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: VARIANT_PROVIDER_ORDER
        value: fal,stability
      - key: VARIANT_INTEGRITY_THRESHOLD
        value: "0.99"
      - key: FAL_TIMEOUT_SECONDS
        value: "60"
      - key: IOPAINT_DEVICE
        value: cpu

  # ══════════════════════════════════════════════
  # 3. BACKGROUND WORKER — Video AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-video
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m media_ai.video.video_worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # 4. BACKGROUND WORKER — Vision AI
  # ══════════════════════════════════════════════
  - type: worker
    name: smeos-worker-vision
    runtime: python
    region: singapore
    plan: starter
    rootDir: workers
    buildCommand: pip install -r requirements.txt
    startCommand: python -m vision.jobs.worker
    autoDeploy: true
    branch: main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smeos-postgres
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

  # ══════════════════════════════════════════════
  # 5. CRON — nhắc mốc tiến độ đơn gia công chuỗi (M1–M4), 5 phút/lần
  # ══════════════════════════════════════════════
  # Gọi web qua mạng nội bộ Render. Không có job này thì nhắc việc M1–M4 không bao giờ chạy.
  # Lượt quét cũng dọn job treo quá 15 phút (YC-J10). Sau lượt quét, kiểm /internal/health: không khoẻ → 503 → lượt cron thất bại → Render báo lỗi.
  - type: cron
    name: smeos-cron-dispatch-sweep
    runtime: node
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: echo "no build"
    startCommand: >-
      curl -fsS -X POST "http://$WEB_HOSTPORT/api/v1/internal/chain-dispatch-sweep"
      -H "x-cron-secret: $CRON_SECRET" --max-time 120
      && curl -fsS "http://$WEB_HOSTPORT/api/v1/internal/health"
      -H "x-cron-secret: $CRON_SECRET" --max-time 20
    envVars:
      - key: WEB_HOSTPORT
        fromService:
          type: web
          name: smeos-web
          property: hostport
      - key: CRON_SECRET
        sync: false

  # ══════════════════════════════════════════════
  # KEY VALUE (Redis) — bộ đếm giới hạn tần suất dùng chung các instance
  # Gói trả phí 256mb: workspace chỉ có 1 instance free và đang dùng cho project khác.
  # ══════════════════════════════════════════════
  - type: keyvalue
    name: smeos-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # chỉ dịch vụ nội bộ Render truy cập

# ══════════════════════════════════════════════
# DATABASE — PostgreSQL 16
# ══════════════════════════════════════════════
databases:
  - name: smeos-postgres
    databaseName: smeos
    user: smeos
    region: singapore
    plan: basic-256mb

services:
  db:
    build:
      context: ./docker
      dockerfile: postgres-pgcron.Dockerfile
    container_name: smeos-db
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=smeos"]
    environment:
      POSTGRES_USER: smeos
      POSTGRES_PASSWORD: smeos
      POSTGRES_DB: smeos
    ports:
      - "5433:5432"
    volumes:
      - smeos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smeos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smeos-db-data:
